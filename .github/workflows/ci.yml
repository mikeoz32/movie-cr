name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  specs:
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.19.1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movie
          POSTGRES_PASSWORD: movie
          POSTGRES_DB: movie_test
        options: >-
          --health-cmd "pg_isready -U movie -d movie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOVIE_POSTGRES_TEST_URL: postgres://movie:movie@postgres:5432/movie_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev
      - name: Install shards
        run: shards install
      - name: Check formatting
        run: crystal tool format --check src spec examples
      - name: Run specs
        run: crystal spec spec/movie -Dpreview_mt -Dexecution_context
      - name: Build examples
        run: |
          for file in examples/*.cr; do
            crystal build "$file" -Dpreview_mt -Dexecution_context -o "/tmp/movie-$(basename "$file" .cr)"
          done
